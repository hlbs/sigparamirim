name: Publicar release do SIG Paramirim

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publicar versão no GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da versão
        uses: actions/checkout@v4

      - name: Criar release para a versão do pacote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v$VERSION"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "O release $TAG já existe; nenhuma duplicação será criada."
            exit 0
          fi

          NOTES_FILE="$(mktemp)"
          VERSION="${TAG#v}"
          awk -v version="## [$VERSION]" '
            index($0, version) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "Não há notas em português para $VERSION no CHANGELOG.md." >&2
            exit 1
          fi

          RELEASE_ARGS=("$TAG" --repo "$GITHUB_REPOSITORY" --title "SIG Paramirim $TAG" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA")
          if [[ "$TAG" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "${RELEASE_ARGS[@]}"
